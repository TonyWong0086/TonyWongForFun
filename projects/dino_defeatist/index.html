<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No internet</title>
  <meta name="description" content="The offline dinosaur game, except the dinosaur has thought it over.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="../../assets/theme.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <a href="../../index.html" class="exit-link">Go back online</a>

  <main id="game-container">
    <div class="error-page">
      <!-- The game strip, in its pixel font. -->
      <div class="canvas-area">
        <div id="dino-wrapper">
          <div id="speech-bubble" class="speech-bubble"></div>
          <svg id="dino" viewBox="0 0 44 47" aria-label="A dinosaur">
            <path fill="#535353"
              d="M22 2h14v2h2v2h2v10h-2v2h-8v2h2v2h10v2h2v12h-2v2h-2v2h-2v2h-2v2h-2v-2h-2v-4h-2v2h-2v2h-4v-2h-2v-2h-2v-12h2v-2h2v-2h2v-2H6v-2H4v-2H2v-10h2V8h2V6h2V4h14v2z" />
            <rect id="dino-eye" x="26" y="8" width="4" height="4" fill="#ffffff" />
          </svg>
        </div>

        <svg class="cactus" style="right: 150px; height: 35px;" viewBox="0 0 25 50" aria-hidden="true">
          <path fill="#535353" d="M10 0h5v50h-5zm-7 15h5v20H3zm14 5h5v15h-5z" />
          <rect x="5" y="30" width="10" height="5" fill="#535353" />
          <rect x="15" y="35" width="5" height="5" fill="#535353" />
        </svg>

        <svg class="cloud" style="right: 50px; top: 10px;" viewBox="0 0 46 13" aria-hidden="true">
          <path fill="#535353" d="M10 2h10v2h5v2h10v2h5v2h6v3H0v-3h2v-2h3V6h5V2z" />
        </svg>
      </div>

      <div class="game-meta">
        <span id="instruction" class="instruction">Press space to jump</span>
        <span id="naps">NAPS TAKEN: 0</span>
      </div>

      <!-- The page itself, in the browser's own voice. -->
      <h1>No internet</h1>
      <p class="try">Try:</p>
      <ul class="steps">
        <li>Checking the network cables, modem and router</li>
        <li>Reconnecting to Wi-Fi</li>
        <li>Lying down until the feeling passes</li>
      </ul>

      <div class="error-foot">
        <span class="err-code">ERR_INTERNET_DISCONNECTED</span>
        <button class="reload" type="button" onclick="location.reload()">Reload</button>
      </div>
    </div>
  </main>

  <script src="../../assets/hub.js" data-hub="../../index.html" data-no-back></script>
  <script src="script.js"></script>
</body>

</html>
