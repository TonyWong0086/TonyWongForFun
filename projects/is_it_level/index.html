<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Is It Level?</title>
  <meta name="description" content="One crooked horizon on a gallery wall. Straighten it to the satisfaction of nobody.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="../../assets/theme.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="gallery-wall">
    <a href="../../index.html" class="exit-link">Leave gallery</a>

    <div class="frame-container">
      <!-- The wall's own datum. It is perfectly level. The painting is not. -->
      <div class="datum" aria-hidden="true"></div>

      <div id="art-frame" style="transform: rotate(1.2deg);">
        <div class="art-image">
          <span class="horizon" aria-hidden="true"></span>
        </div>
      </div>

      <figcaption class="wall-label">
        <span class="artist">Tony Wong, b. unknown</span>
        <h1>Atmospheric Tension No. 4</h1>
        <span class="medium">Oil on canvas, 2024</span>
        <span class="acquisition">On loan. Indefinitely.</span>
      </figcaption>
    </div>

    <div class="controls">
      <div id="status" class="status-badge">Adjustment required</div>
      <input id="tilt-slider" type="range" min="-5" max="5" step="0.01" value="1.2"
        aria-label="Tilt the painting">
      <p class="control-note">Drag to align the horizon &middot; <span id="attempts">0</span> attempts</p>
    </div>
  </div>

  <script src="../../assets/hub.js" data-hub="../../index.html" data-no-back></script>
  <script src="script.js"></script>
</body>

</html>
