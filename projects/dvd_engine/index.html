<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVD Corner Engine</title>
  <meta name="description" content="The bouncing logo, running live. Stay until it hits a corner exactly.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="../../assets/theme.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
  <!-- Scanlines and screen curvature, so this reads as a set, not a page. -->
  <div class="crt" aria-hidden="true"></div>

  <header class="hud-top">
    <span class="live"><i aria-hidden="true"></i>Live</span>
    <span class="channel">Anticipation Engine v2.0</span>
    <a href="../../index.html" class="exit-link">Exit</a>
  </header>

  <div id="celebration">Corner hit</div>

  <div id="dvd-logo" style="color: #ff0000;">
    <svg viewBox="0 0 100 50" width="100%" height="100%" aria-label="DVD logo">
      <path fill="currentColor"
        d="M15,10 C15,5 20,5 25,5 L75,5 C80,5 85,5 85,10 L85,40 C85,45 80,45 75,45 L25,45 C20,45 15,45 15,40 L15,10 Z M20,15 L20,35 L40,35 L40,30 L30,30 L30,25 L35,25 L35,20 L30,20 L30,15 L20,15 Z M45,15 L45,35 L55,35 L60,25 L65,35 L75,35 L75,15 L68,15 L68,28 L60,15 L52,15 L52,28 L52,15 L45,15 Z" />
      <text x="50" y="40" font-family="Arial" font-size="8" text-anchor="middle" fill="currentColor"
        font-weight="bold">DVD</text>
    </svg>
  </div>

  <footer id="stats" class="hud">
    <div class="vigil">
      <span class="hud-label">Waiting for a corner</span>
      <strong id="timer">0:00</strong>
    </div>

    <dl class="readout">
      <div>
        <dt>Bounces</dt>
        <dd id="bounce-count">0</dd>
      </div>
      <div>
        <dt>Corner hits</dt>
        <dd id="corner-count">0</dd>
      </div>
      <div>
        <dt>Near misses</dt>
        <dd id="near-count">0</dd>
      </div>
      <div>
        <dt>Best wait</dt>
        <dd id="best-time">&mdash;</dd>
      </div>
    </dl>

    <p class="hint">Press C if you cannot wait.</p>
  </footer>

  <script src="../../assets/hub.js" data-hub="../../index.html" data-no-back data-dark></script>
  <script src="script.js"></script>
</body>

</html>
