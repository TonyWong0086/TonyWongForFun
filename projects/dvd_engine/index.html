<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>DVD Corner Anticipation - TonyWong0086</title>

    <link rel="stylesheet" href="../../assets/theme.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #dvd-logo {
            position: absolute;
            width: 150px;
            height: 70px;
            user-select: none;
            transition: color 0.1s;
        }

        .overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            pointer-events: none;
        }

        .exit-link {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            text-decoration: none;
            z-index: 1000;
        }
        .exit-link:hover { color: white; }

        #stats {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            pointer-events: none;
        }

        /* Celebration message */
        #celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            color: white;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 80px;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            opacity: 0;
            pointer-events: none;
            z-index: 500;
        }

        #celebration.show {
            animation: celebrate 2s cubic-bezier(0.17, 0.89, 0.32, 1.49) forwards;
        }

        @keyframes celebrate {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
        }
    </style>
</head>

<body>
    <a href="../../index.html" class="exit-link">EXIT SIMULATOR</a>
    <div class="overlay">Anticipation Engine v2.0</div>
    
    <div id="stats">
        Bounces: <span id="bounce-count">0</span> |
        Corner Hits: <span id="corner-count">0</span> |
        Watching for: <span id="timer">0:00</span> |
        Best time to corner: <span id="best-time">—</span> |
        Near misses: <span id="near-count">0</span>
    </div>

    <div id="celebration">CORNER HIT!</div>

    <div id="dvd-logo" style="color: #ff0000;">
        <svg viewBox="0 0 100 50" width="100%" height="100%">
            <path fill="currentColor" d="M15,10 C15,5 20,5 25,5 L75,5 C80,5 85,5 85,10 L85,40 C85,45 80,45 75,45 L25,45 C20,45 15,45 15,40 L15,10 Z M20,15 L20,35 L40,35 L40,30 L30,30 L30,25 L35,25 L35,20 L30,20 L30,15 L20,15 Z M45,15 L45,35 L55,35 L60,25 L65,35 L75,35 L75,15 L68,15 L68,28 L60,15 L52,15 L52,28 L52,15 L45,15 Z" />
            <text x="50" y="40" font-family="Arial" font-size="8" text-anchor="middle" fill="currentColor" font-weight="bold">DVD</text>
        </svg>
    </div>

    <script src="../../assets/hub.js" data-hub="../../index.html" data-no-back data-dark></script>
    <script src="script.js"></script>
</body>

</html>
