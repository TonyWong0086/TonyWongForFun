<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Credential Judgment Unit — Fun Stuffs</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/theme.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { light: '#6366f1', DEFAULT: '#4f46e5', dark: '#4338ca' },
                        danger: '#ef4444',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                },
            },
        }
    </script>
    <style>
        .dot-grid {
            background-color: #ffffff;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Hide scrollbars */
        * { scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }

        /* Strength meter animation */
        .strength-bar {
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s ease;
        }

        /* Judgment text fade */
        .judgment-text {
            transition: opacity 0.3s ease;
        }

        /* Pity score counter */
        .pity-score {
            font-variant-numeric: tabular-nums;
        }

        /* Typing indicator */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .cursor-blink::after {
            content: '|';
            animation: blink 1s step-end infinite;
            color: #94a3b8;
        }

        /* Sarcasm level shake */
        @keyframes micro-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        .shake {
            animation: micro-shake 0.3s ease;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dot-grid min-h-screen text-slate-900 font-sans selection:bg-brand/20">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <nav class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="text-2xl font-bold tracking-tight">
                <a class="hover:opacity-80 transition-opacity" href="../../index.html">
                    TonyWong<span class="text-brand">0086</span>
                </a>
            </div>
            <div class="flex items-center gap-8">
                <a class="text-sm font-medium text-slate-500 hover:text-brand transition-colors" href="../../index.html">
                    <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
                    Back to Hub
                </a>
            </div>
        </nav>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-16 md:py-24">

        <!-- Hero -->
        <header class="text-center mb-16">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-red-50 rounded-3xl mb-6 shadow-sm border border-red-100 text-red-500">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4">
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-orange-500">
                    Password Checker
                </span>
            </h1>
            <p class="text-lg text-slate-500 max-w-xl mx-auto">
                Credential Judgment Unit <span class="italic">CJ-86</span>.
            </p>
        </header>

        <!-- Input Area -->
        <section class="bg-white/70 backdrop-blur-xl border border-slate-200 rounded-3xl p-8 md:p-10 shadow-sm mb-8">
            <label for="password-input" class="block text-sm font-semibold text-slate-700 mb-3">Enter your password</label>
            <div class="relative">
                <input type="text" id="password-input" autocomplete="off" spellcheck="false"
                       class="w-full px-5 py-4 rounded-2xl border-slate-200 focus:border-brand focus:ring-brand focus:ring-2 focus:ring-opacity-20 font-mono text-lg tracking-wider transition-shadow"
                       placeholder="Go ahead, type something predictable...">
                <button id="clear-btn" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 transition-colors hidden"
                        title="Clear">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Strength Bar -->
            <div class="mt-6">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Strength</span>
                    <span id="strength-label" class="text-xs font-bold uppercase tracking-wider text-slate-300">Waiting...</span>
                </div>
                <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                    <div id="strength-bar" class="strength-bar h-full rounded-full bg-slate-200 w-0"></div>
                </div>
                <p class="mt-3 text-xs text-slate-400">
                    Estimated time to crack: <span id="crack-time" class="font-mono font-semibold text-slate-600">—</span>
                </p>
            </div>
        </section>

        <!-- Judgment Panel -->
        <section id="judgment-panel" class="bg-white/70 backdrop-blur-xl border border-slate-200 rounded-3xl p-8 md:p-10 shadow-sm mb-8 hidden">
            <!-- Main Roast -->
            <div class="mb-8">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.444 3 12c0 2.104.859 4.023 2.273 5.48.432.447.74 1.04.586 1.641a4.483 4.483 0 01-.923 1.785A5.969 5.969 0 006 21c1.282 0 2.47-.402 3.445-1.087.81.22 1.668.337 2.555.337z"/></svg>
                    The Judgment
                </h3>
                <p id="judgment-text" class="judgment-text text-lg md:text-xl leading-relaxed text-slate-700 font-medium"></p>
            </div>

            <!-- Hacker Pity Score -->
            <div class="bg-slate-50 rounded-2xl p-6 mb-6">
                <div class="flex items-center justify-between mb-2">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.182 15.182a4.5 4.5 0 01-6.364 0M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75zm-.375 0h.008v.015h-.008V9.75zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75zm-.375 0h.008v.015h-.008V9.75z"/></svg>
                        Hacker Pity Score
                    </h4>
                    <span id="pity-score" class="pity-score text-2xl font-extrabold text-slate-900">0%</span>
                </div>
                <p id="pity-text" class="text-sm text-slate-500"></p>
            </div>

            <!-- Attempt Counter (sarcasm escalation) -->
            <div class="flex items-center justify-between text-sm text-slate-400 border-t border-slate-100 pt-4">
                <span>Attempts to impress me:</span>
                <span id="attempt-count" class="font-mono font-bold text-slate-600">0</span>
            </div>
        </section>

        <!-- Sarcasm Escalation Banner -->
        <div id="sarcasm-banner" class="text-center text-sm text-slate-400 italic hidden"></div>
    </main>

    <script src="../../assets/hub.js" data-hub="../../index.html" data-no-back></script>
    <script src="script.js"></script>
</body>
</html>
