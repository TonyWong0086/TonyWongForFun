<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Action Search</title>
  <meta name="description" content="A plain search box where every keystroke arrives as an action sequence.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="../../assets/theme.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="rig">
    <!-- Top matte: the slate -->
    <div class="matte matte-top">
      <span class="slate-title">Action Search</span>
      <span class="slate-data">Scene 01 &middot; Take 14</span>
      <span class="slate-data slate-dir">Dir. JavaScript</span>
    </div>

    <!-- The shot. Everything detonates in here. -->
    <div id="search-container">
      <input type="text" placeholder="Search with intensity" spellcheck="false" autofocus
        aria-label="Search with intensity">
    </div>

    <!-- Bottom matte: the recorder -->
    <div class="matte matte-bottom">
      <span class="rec"><i aria-hidden="true"></i>REC</span>
      <span class="slate-data" id="timecode">00:00:00:00</span>
      <button id="sound-toggle" type="button">SFX: Off</button>
      <a href="../../index.html" class="exit-link">Abort mission</a>
    </div>
  </div>

  <script src="../../assets/hub.js" data-hub="../../index.html" data-no-back data-dark></script>
  <script src="script.js"></script>
</body>

</html>
