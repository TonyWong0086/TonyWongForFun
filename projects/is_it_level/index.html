<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Is It Level? - TonyWong0086</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/theme.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #e5e1d8; /* Sophisticated gallery wall color */
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .gallery-wall {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 30%, #f5f2eb 0%, #e5e1d8 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.05);
        }

        header {
            position: fixed;
            top: 40px;
            text-align: center;
            opacity: 0.6;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-style: italic;
            letter-spacing: 0.05em;
            color: #4a453e;
        }

        .frame-container {
            position: relative;
            padding: 60px;
            perspective: 1000px;
        }

        #art-frame {
            position: relative;
            width: 400px;
            height: 500px;
            background: white;
            padding: 40px;
            box-shadow: 
                0 30px 60px -12px rgba(50,50,93,0.15),
                0 18px 36px -18px rgba(0,0,0,0.2),
                0 -12px 36px -8px rgba(0,0,0,0.01);
            border: 12px solid #2a2825;
            transform-origin: center center;
            transition: transform 0.1s cubic-bezier(0.2, 0, 0.2, 1);
            cursor: default;
        }

        #art-frame::before {
            content: '';
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 40px;
            background: #8a847a;
            opacity: 0.3;
        }

        .art-image {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #6366f1, #a855f7);
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .art-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(rgba(255,255,255,0.1), transparent);
            pointer-events: none;
        }

        .controls {
            position: fixed;
            bottom: 80px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #8a847a;
            background: rgba(255,255,255,0.5);
            padding: 4px 12px;
            border-radius: 100px;
            transition: all 0.3s;
        }

        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            background: #d1cdc4;
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: white;
            border: 1px solid #d1cdc4;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -9px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        input[type=range]:active::-webkit-slider-thumb {
            transform: scale(1.2);
            background: #2a2825;
            border-color: #2a2825;
        }

        .exit-link {
            position: fixed;
            top: 40px;
            left: 40px;
            font-size: 11px;
            color: #8a847a;
            text-decoration: none;
            letter-spacing: 0.05em;
        }
        .exit-link:hover { color: #4a453e; }
    </style>
</head>

<body>
    <div class="gallery-wall">
        <a href="../../index.html" class="exit-link">← LEAVE GALLERY</a>

        <header>
            <h1>Atmospheric Tension No. 4</h1>
            <p class="text-[9px] uppercase tracking-widest mt-2 text-stone-400">Oil on Canvas, 2024</p>
        </header>

        <div class="frame-container">
            <div id="art-frame" style="transform: rotate(1.2deg);">
                <div class="art-image">
                    <span class="opacity-80 italic">The Perfection of Instability</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <div id="status" class="status-badge">Adjustment Required</div>
            <input id="tilt-slider" type="range" min="-5" max="5" step="0.01" value="1.2">
            <div class="text-[9px] text-stone-400">DRAG TO ALIGN HORIZON · <span id="attempts">0</span> ATTEMPTS</div>
        </div>
    </div>

    <script src="../../assets/hub.js" data-hub="../../index.html" data-no-back></script>
    <script src="script.js"></script>
</body>

</html>
