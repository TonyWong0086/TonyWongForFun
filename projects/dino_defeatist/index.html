<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>No Internet (Probably) - TonyWong0086</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/theme.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f7f7f7;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            color: #535353;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .canvas-area {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 150px;
            border-bottom: 2px solid #535353;
            overflow: visible;
        }

        #dino {
            position: absolute;
            bottom: 0;
            left: 50px;
            width: 44px;
            height: 47px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom center;
        }

        /* The "Nap" State */
        #dino.depressed {
            transform: rotate(-90deg) translate(-10px, 10px);
        }

        .cactus {
            position: absolute;
            bottom: 0;
            right: -50px;
            width: 25px;
            height: 50px;
        }

        .cloud {
            position: absolute;
            top: 20px;
            right: 0;
            width: 46px;
            height: 13px;
            opacity: 0.5;
        }

        .speech-bubble {
            position: absolute;
            top: -60px;
            left: 80px;
            background: white;
            border: 2px solid #535353;
            padding: 10px;
            font-size: 8px;
            line-height: 1.4;
            width: 150px;
            display: none;
            z-index: 10;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 10px;
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #535353 transparent transparent;
        }

        .instruction {
            margin-top: 40px;
            font-size: 10px;
            opacity: 0.6;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.6; }
        }

        .exit-link {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 8px;
            color: #535353;
            text-decoration: underline;
            opacity: 0.5;
            z-index: 1000;
        }
        .exit-link:hover { opacity: 1; }
    </style>
</head>

<body>
    <a href="../../index.html" class="exit-link">← GO BACK ONLINE</a>

    <div id="game-container">
        <div class="text-xs mb-12 opacity-80">No internet</div>
        
        <div class="canvas-area">
            <!-- Dino -->
            <div id="dino-wrapper">
                <div id="speech-bubble" class="speech-bubble"></div>
                <svg id="dino" viewBox="0 0 44 47">
                    <path fill="#535353" d="M22 2h14v2h2v2h2v10h-2v2h-8v2h2v2h10v2h2v12h-2v2h-2v2h-2v2h-2v2h-2v-2h-2v-4h-2v2h-2v2h-4v-2h-2v-2h-2v-12h2v-2h2v-2h2v-2H6v-2H4v-2H2v-10h2V8h2V6h2V4h14v2z"/>
                    <!-- Eye -->
                    <rect x="26" y="8" width="4" height="4" fill="#f7f7f7"/>
                </svg>
            </div>

            <!-- Static Cacti -->
            <svg class="cactus" style="right: 150px; height: 35px;" viewBox="0 0 25 50">
                <path fill="#535353" d="M10 0h5v50h-5zm-7 15h5v20H3zm14 5h5v15h-5z"/>
                <rect x="5" y="30" width="10" height="5" fill="#535353"/>
                <rect x="15" y="35" width="5" height="5" fill="#535353"/>
            </svg>

            <!-- Clouds -->
            <svg class="cloud" style="right: 50px; top: 10px;" viewBox="0 0 46 13">
                <path fill="#535353" d="M10 2h10v2h5v2h10v2h5v2h6v3H0v-3h2v-2h3V6h5V2z"/>
            </svg>
        </div>

        <div id="instruction" class="instruction">Press Space to Jump</div>
        <div id="naps" class="mt-6 text-[8px] opacity-40 tracking-widest">NAPS TAKEN: 0</div>
    </div>

    <script src="../../assets/hub.js" data-hub="../../index.html" data-no-back></script>
    <script src="script.js"></script>
</body>

</html>
