<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Action Search - TonyWong0086</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/theme.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.1s;
        }

        .shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        #search-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        input {
            width: 500px;
            padding: 20px 30px;
            font-size: 24px;
            border: 2px solid #eee;
            border-radius: 12px;
            outline: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        input:focus {
            border-color: #000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .particle {
            position: fixed;
            width: 8px;
            height: 8px;
            pointer-events: none;
            z-index: 5;
            border-radius: 2px;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        .exit-link {
            position: fixed;
            top: 30px;
            left: 30px;
            color: #ccc;
            font-size: 12px;
            text-decoration: none;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .exit-link:hover { color: #000; }
        
        .flash {
            background-color: #ff0055 !important;
        }
    </style>
</head>

<body>
    <!-- Exit link is OUTSIDE the shake wrapper so it stays put -->
    <a href="../../index.html" class="exit-link">← Abort Mission</a>

    <!-- This wrapper gets the shake class, not body -->
    <div id="search-container">
        <input type="text" placeholder="Search with intensity..." spellcheck="false" autofocus>
    </div>

    <!-- Sound toggle (audio needs a user gesture; the input typing provides it) -->
    <button id="sound-toggle" class="fixed bottom-6 right-6 z-[1000] text-[11px] font-bold uppercase tracking-widest text-gray-300 hover:text-black transition-colors">
        🔇 SFX: Off
    </button>

    <script src="../../assets/hub.js" data-hub="../../index.html" data-no-back></script>
    <script src="script.js"></script>
</body>

</html>
