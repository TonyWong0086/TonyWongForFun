<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credential Judgment Unit</title>
  <meta name="description" content="Type a password, get an estimated crack time and a considerable amount of unsolicited judgment.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="../../assets/theme.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="rack">
    <header class="chassis-top">
      <a class="unit-id" href="../../index.html" aria-label="Disconnect the unit">CJU&ndash;14</a>
      <span class="unit-name">Credential Judgment Unit</span>
      <span class="power"><i aria-hidden="true"></i>Armed</span>
    </header>

    <main class="panel">
      <section class="intake">
        <label class="field-label" for="password-input">Specimen</label>
        <div class="input-row">
          <input id="password-input" type="text" placeholder="Type a password" autocomplete="off"
            spellcheck="false" autofocus>
          <button id="clear-btn" class="hidden" type="button">Clear</button>
        </div>

        <div class="meter">
          <div class="meter-track"><div id="strength-bar"></div></div>
          <span id="strength-label" class="strength-label is-idle">Waiting...</span>
        </div>
      </section>

      <section class="readouts">
        <div class="readout readout-wide">
          <span class="readout-label">Estimated time to crack</span>
          <strong id="crack-time">&mdash;</strong>
        </div>
        <div class="readout">
          <span class="readout-label">Attempts</span>
          <strong id="attempt-count">0</strong>
        </div>
        <div class="readout">
          <span class="readout-label">Pity</span>
          <strong id="pity-score">&mdash;</strong>
        </div>
      </section>

      <section id="judgment-panel" class="verdict hidden">
        <span class="readout-label">Verdict</span>
        <p id="judgment-text"></p>
        <p id="pity-text" class="pity-note"></p>
      </section>

      <p id="sarcasm-banner" class="banner hidden"></p>
    </main>

    <footer class="chassis-foot">
      <span>Nothing you type leaves this page. The unit is judgmental, not networked.</span>
      <a href="../../index.html">Disconnect</a>
    </footer>
  </div>

  <script src="../../assets/hub.js" data-hub="../../index.html" data-no-back data-dark></script>
  <script src="script.js"></script>
</body>

</html>
